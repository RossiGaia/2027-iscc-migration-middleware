apiVersion: v1
kind: ConfigMap
metadata:
  name: dt-confs
data:
  config.yaml: |
    name: "DT1"

    connections:
      mqtt:
        client_id: "dt_1"
        broker_url: "mosquitto.default.svc.cluster.local"
        port: 1883
        topics:
        - "test/#"
      mongodb:
        use: yes
        url: "mongodb://user:pass@mongo.default.svc.cluster.local:27017"
        database: "pt"
        collection: "events"
      redis:
        host: "redis.default.svc.cluster.local"
        port: 6379
        db: 0
      buffer:
        size: 1000

    flask:
      port: 5003

    state:
      max_size_mb: 10
      max_entry_size_kb: 10
      backend: "local"

    migration:
      live:
        rounds: 10

    odte:
      expected_msg_sec: 1

    logger:
      level:
        shell: info
        file: error
        mongo: warning