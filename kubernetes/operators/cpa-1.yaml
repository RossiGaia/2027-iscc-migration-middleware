apiVersion: test.dev/v1
kind: CyberPhysicalApplication
metadata:
  name: "cpa-1"
spec:
  # debug migrazione
  migrate: false
  source: ""
  twinType: "simple"
  twinOf:
    - "led_1"
  requirements:
    preferredAffinity: "cloud"
    odte: 0.9
  deployments:
    - type: "Kubernetes"
      affinity: "edge"
      configs:
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            namespace: default
            name: dt-1-deployment-edge
            labels:
              app: dt-1-edge
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: dt-1-edge
            template:
              metadata:
                labels:
                  app: dt-1-edge
              spec:
                containers:
                  - name: dt-1-edge
                    image: docker.io/rssgai/2027-iscc-dt:v5
                    imagePullPolicy: IfNotPresent
                    env:
                      - name: POD_NAME
                        valueFrom: { fieldRef: { fieldPath: metadata.name } }
                      - name: NODE_NAME
                        valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
                    readinessProbe:
                      httpGet: { path: /healthd, port: 5003 }
                      periodSeconds: 1
                    volumeMounts:
                      - { name: dt-confs, mountPath: /app/dt/configs/ }
                      - { name: events, mountPath: /events }
                volumes:
                  - { name: dt-confs, configMap: { name: dt-confs } }
                  - { name: events, hostPath: { path: /events, type: DirectoryOrCreate } }

        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: dt-1-service-edge
          spec:
            selector:
              app: dt-1-edge
            ports:
              - name: http
                port: 5003
                targetPort: 5003
            type: NodePort

    - type: "Kubernetes"
      affinity: "cloud"
      configs:
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            namespace: default
            name: dt-1-deployment-cloud
            labels:
              app: dt-1-cloud
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: dt-1-cloud
            template:
              metadata:
                labels:
                  app: dt-1-cloud
              spec:
                containers:
                  - name: dt-1-cloud
                    image: docker.io/rssgai/2027-iscc-dt:v5
                    imagePullPolicy: IfNotPresent
                    env:
                    - name: POD_NAME
                      valueFrom: { fieldRef: { fieldPath: metadata.name } }
                    - name: NODE_NAME
                      valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
                    readinessProbe:
                      httpGet: { path: /healthd, port: 5003 }
                      periodSeconds: 1
                    volumeMounts:
                      - { name: dt-confs, mountPath: /app/dt/configs/ }
                      - { name: events, mountPath: /events }
                volumes:
                  - { name: dt-confs, configMap: { name: dt-confs } }
                  - { name: events, hostPath: { path: /events, type: DirectoryOrCreate } }

        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: dt-1-service-cloud
          spec:
            selector:
              app: dt-1-cloud
            ports:
              - name: http
                port: 5003
                targetPort: 5003
            type: NodePort
