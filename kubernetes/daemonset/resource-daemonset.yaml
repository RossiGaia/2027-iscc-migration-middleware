apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: counters-agent
spec:
  selector:
    matchLabels:
      app: counters-agent
  template:
    metadata:
      labels:
        app: counters-agent
    spec:
      hostNetwork: true
      containers:
        - name: agent
          image: docker.io/rssgai/2027-iscc-counters-agent:v2
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: IFACE
              value: "ens3"
            - name: PORT
              value: "9200"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: events
              mountPath: /events
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: events
          hostPath:
            path: /events
            type: DirectoryOrCreate