---

apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-confs
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    max_queued_messages 0

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
spec:
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      nodeSelector: {zone: cloud}
      containers:
      - name: mosquitto-container
        image: eclipse-mosquitto:openssl
        ports:
        - containerPort: 1883
        volumeMounts:
          - name: mosquitto-configfile
            mountPath: /mosquitto/config/

      volumes:
        - name: mosquitto-configfile
          configMap:
            name: mosquitto-confs

---

apiVersion: v1
kind: Service
metadata:
  name: mosquitto
spec:
  type: NodePort
  selector:
    app: mosquitto
  ports:
  - port: 1883
    targetPort: 1883
    nodePort: 31883

