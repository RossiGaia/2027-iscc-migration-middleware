apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector: {zone: cloud}
      containers:
      - name: redis
        image: redis:8.8.3
        ports:
        - containerPort: 6379
        args: ["--save", "", "--appendonly", "no"]

---

apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
